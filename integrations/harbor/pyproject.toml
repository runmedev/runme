[project]
name = "runme-harbor"
version = "0.1.7"
description = "Runme Harbor environment adapter"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Runme Authors" }]
keywords = ["runme", "harbor", "evals", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Shells",
]
dependencies = [
  "harbor>=0.23,<0.24",
  "protobuf>=7.36.2",
]
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://runme.dev"
Documentation = "https://docs.runme.dev"
Repository = "https://github.com/runmedev/runme"
Issues = "https://github.com/runmedev/runme/issues"

[project.scripts]
runme-harbor = "runme_harbor.cli:main"
runme-harbor-harbor = "harbor.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runme_harbor"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.10,<0.17",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
